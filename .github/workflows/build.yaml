name: Build

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read
  actions: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            system: x86_64-linux
          - os: ubuntu-26.04-arm
            system: aarch64-linux
          - os: macos-26
            system: aarch64-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            accept-flake-config = true
            auto-optimise-store = ${{ startsWith(matrix.os, 'macos-') && 'false' || 'true' }}
            sandbox = ${{ startsWith(matrix.os, 'macos-') && 'relaxed' || 'true' }}
            keep-env-derivations = true
            keep-outputs = true
      - name: Setup cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: warashi
          extraPullNames: nix-community
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: false # PR でも push して、 main にマージされたときにキャッシュが使えるようにする
          useDaemon: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          show-progress: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/nix
          # matrix.os だと ubuntu-26.04 が ubuntu-26.04-arm の前方一致になり、
          # restore-keys で別アーキテクチャのエントリを掴む。runner.os と
          # runner.arch の組は互いに前方一致しない
          key: nix-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/flake.lock') }}-${{ hashFiles('**/*.nix') }}
          restore-keys: |
            nix-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/flake.lock') }}-
            nix-cache-${{ runner.os }}-${{ runner.arch }}-
      - name: Build checks
        # --flake を system まで絞るのは、.#checks のままだと他 system の
        # checks まで評価し、IFD がプラットフォーム不一致で失敗するため。
        # eval worker を絞るのは、ホスト全体の評価を並べると
        # メモリの少ない macOS runner で足りなくなるため
        env:
          TARGET_SYSTEM: ${{ matrix.system }}
        run: >-
          nix run --inputs-from . nixpkgs#nix-fast-build --
          --flake ".#checks.${TARGET_SYSTEM}"
          --option show-trace true
          --no-nom
          --skip-cached
          --eval-workers 2
          --eval-max-memory-size 3072
      - name: Check disk usage
        if: always()
        run: df -h
