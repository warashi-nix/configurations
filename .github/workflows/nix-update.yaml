name: Update Nix Flake Inputs, nvfetcher.toml and Emacs Packages

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 1 * * *"
      timezone: "Asia/Tokyo"

permissions: {}

# ubuntu-slim は LANG が未設定で、GHC 製の nvfetcher が git の出力を ASCII として読むため、
# 非 ASCII を含むコミットメッセージで hGetContents エラーになる
env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  list-flake-inputs:
    runs-on: ubuntu-slim
    outputs:
      inputs: ${{ steps.list-flake-inputs.outputs.inputs }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          show-progress: false
      - name: List flake inputs
        id: list-flake-inputs
        # my-emacs-pkgs は root の lock を lock/flake.lock からミラーするだけなので、
        # ここで更新しても no-op になる。update-emacs-packages に任せる
        run: echo "inputs=$(jq -c '.nodes[.root].inputs | keys - ["my-emacs-pkgs"]' flake.lock)" >> "$GITHUB_OUTPUT"

  list-nvfetcher:
    runs-on: ubuntu-slim
    outputs:
      sources: ${{ steps.list-nvfetcher.outputs.sources }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          show-progress: false
      - name: List nvfetcher sources
        id: list-nvfetcher
        # ソース名は _sources/generated.json ではなく nvfetcher.toml のテーブル名から採る。
        # まだ一度も fetch していない新規ソースも初回から対象に入るため
        run: |
          sources=$(
            find . -name nvfetcher.toml | sort | while read -r toml; do
              dir=$(dirname "$toml")
              grep -o '^\[[^]]*\]' "$toml" | tr -d '[]' | while read -r source; do
                jq -cn --arg dir "$dir" --arg source "$source" '{dir: $dir, source: $source}'
              done
            done | jq -cs .
          )
          echo "sources=${sources}" >> "$GITHUB_OUTPUT"

  list-emacs-packages:
    runs-on: ubuntu-slim
    outputs:
      packages: ${{ steps.list-emacs-packages.outputs.packages }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          show-progress: false
      - name: List emacs packages
        id: list-emacs-packages
        env:
          MODE: ${{ github.event_name == 'workflow_dispatch' && 'all' || 'changed' }}
        run: |
          packages=$(./.github/workflows/list-emacs-updates.sh)
          echo "packages=${packages}" >> "$GITHUB_OUTPUT"

  update-flake-inputs:
    runs-on: ubuntu-slim
    needs: list-flake-inputs
    strategy:
      fail-fast: false
      matrix:
        input: ${{ fromJson(needs.list-flake-inputs.outputs.inputs) }}
    steps:
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.NIX_UPDATER_CLIENT_ID }}
          private-key: ${{ secrets.NIX_UPDATER_APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
          show-progress: false
      - name: Prepare git
        env:
          TARGET_INPUT: ${{ matrix.input }}
        run: |
          git config user.name "warashi-nix-updater[bot]"
          git config user.email "265781387+warashi-nix-updater[bot]@users.noreply.github.com"
          git switch -c "update-flake-inputs-${TARGET_INPUT}"
      - name: Update flake inputs
        env:
          TARGET_INPUT: ${{ matrix.input }}
        run: nix flake update "${TARGET_INPUT}"
      - name: Commit and create pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_INPUT: ${{ matrix.input }}
        run: |
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "chore: update flake inputs (${TARGET_INPUT})"
            git push --force origin HEAD
            gh pr create --title "chore: update flake inputs (${TARGET_INPUT})" --body "This PR updates the flake inputs (${TARGET_INPUT}) to their latest versions." || echo "PR is already open"
            gh pr merge --auto --squash || echo "Failed to merge PR"
          else
            echo "No changes to commit"
          fi

  update-nvfetcher:
    runs-on: ubuntu-slim
    needs: list-nvfetcher
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.list-nvfetcher.outputs.sources) }}
    steps:
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.NIX_UPDATER_CLIENT_ID }}
          private-key: ${{ secrets.NIX_UPDATER_APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
          show-progress: false
      - name: Prepare git
        env:
          TARGET_DIR: ${{ matrix.dir }}
          TARGET_SOURCE: ${{ matrix.source }}
        run: |
          branch_name="${TARGET_DIR#./}"
          branch_name="${branch_name//\//-}"

          git config user.name "warashi-nix-updater[bot]"
          git config user.email "265781387+warashi-nix-updater[bot]@users.noreply.github.com"
          git switch -c "update-nvfetcher-${branch_name}-${TARGET_SOURCE}"
      - name: Update nvfetcher
        # nixpkgs レジストリを引くと channels.nixos.org の nixexprs.tar.xz の展開に
        # 50 秒ほどかかるので、checkout 済みの flake.lock で固定した nixpkgs を使う
        #
        # --filter で 1 ソースに絞る。同じ generated.nix を書く兄弟 PR とは
        # ソースごとに独立したブロックになるので、flake.lock と同様 3-way merge で解決できる
        env:
          TARGET_SOURCE: ${{ matrix.source }}
        run: nix run --inputs-from "path:${GITHUB_WORKSPACE}" 'nixpkgs#nvfetcher' -- --filter "^${TARGET_SOURCE}\$"
        working-directory: ${{ matrix.dir }}
      - name: Commit and create pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_DIR: ${{ matrix.dir }}
          TARGET_SOURCE: ${{ matrix.source }}
        run: |
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "chore: update nvfetcher (${TARGET_DIR}: ${TARGET_SOURCE})"
            git push --force origin HEAD
            gh pr create --title "chore: update nvfetcher.toml (${TARGET_DIR}: ${TARGET_SOURCE})" --body "This PR updates the nvfetcher source ${TARGET_SOURCE} in ${TARGET_DIR} to its latest version." || echo "PR is already open"
            gh pr merge --auto --squash || echo "Failed to merge PR"
          else
            echo "No changes to commit"
          fi

  update-emacs-packages:
    runs-on: ubuntu-slim
    needs: list-emacs-packages
    if: needs.list-emacs-packages.outputs.packages != '[]'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.list-emacs-packages.outputs.packages) }}
    steps:
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            accept-flake-config = true
      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.NIX_UPDATER_CLIENT_ID }}
          private-key: ${{ secrets.NIX_UPDATER_APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
          show-progress: false
      - name: Prepare git
        env:
          TARGET_PACKAGE: ${{ matrix.package }}
        run: |
          git config user.name "warashi-nix-updater[bot]"
          git config user.email "265781387+warashi-nix-updater[bot]@users.noreply.github.com"
          git switch -c "update-emacs-package-${TARGET_PACKAGE}"
      - name: Update emacs package
        env:
          TARGET_PACKAGE: ${{ matrix.package }}
        run: nix flake update "${TARGET_PACKAGE}"
        working-directory: applications/emacs/twist/lock
      - name: Sync my-emacs-pkgs
        # root は my-emacs-pkgs の推移依存を再フェッチせず lock/flake.lock をそのまま
        # ミラーするので、入力名を渡さなくても更新した 1 個だけが root に反映される
        run: nix flake update my-emacs-pkgs
      - name: Regenerate ghostel zig dependencies
        # ghostel の rev bump で ghostty の pin が動くと、build.zig.zon.nix が
        # 古いままではビルドサンドボックスから zig 依存を引けず失敗する。
        # auto-merge が有効なので、再生成は rev bump と同じ commit に含める
        if: matrix.package == 'ghostel'
        run: nix develop --command just emacs-ghostel-zon2nix
      - name: Commit and create pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_PACKAGE: ${{ matrix.package }}
        run: |
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "chore(emacs): update emacs package (${TARGET_PACKAGE})"
            git push --force origin HEAD
            gh pr create --title "chore(emacs): update emacs package (${TARGET_PACKAGE})" --body "This PR updates the emacs package (${TARGET_PACKAGE}) to its latest version." || echo "PR is already open"
            gh pr merge --auto --squash || echo "Failed to merge PR"
          else
            echo "No changes to commit"
          fi
